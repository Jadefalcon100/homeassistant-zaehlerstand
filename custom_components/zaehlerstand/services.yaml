foto_auswerten:
  target:
    entity:
      integration: zaehlerstand
      domain: sensor
    device:
      integration: zaehlerstand
  fields:
    foto:
      selector:
        media:
          accept:
            - image/*
    kamera:
      selector:
        entity:
          domain: camera
    ai_task_entity:
      selector:
        entity:
          domain: ai_task
    erzwingen:
      default: false
      selector:
        boolean:

wert_setzen:
  target:
    entity:
      integration: zaehlerstand
      domain: sensor
    device:
      integration: zaehlerstand
  fields:
    wert:
      required: true
      selector:
        number:
          min: 0
          max: 999999999
          step: 0.001
          mode: box
    erzwingen:
      default: false
      selector:
        boolean:
