foto_auswerten:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: zaehlerstand
          domain: sensor
    foto:
      selector:
        media:
          accept:
            - image/*
    kamera:
      selector:
        entity:
          domain: camera
    ai_task_entity:
      selector:
        entity:
          domain: ai_task
    erzwingen:
      default: false
      selector:
        boolean:

wert_setzen:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: zaehlerstand
          domain: sensor
    wert:
      required: true
      selector:
        number:
          min: 0
          max: 999999999
          step: 0.001
          mode: box
    erzwingen:
      default: false
      selector:
        boolean:
